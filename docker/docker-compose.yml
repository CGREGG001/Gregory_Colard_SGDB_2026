services:
  db:
    image: postgres:15-alpine
    container_name: shelter_postgres
    restart: always
    
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      # Volume persistant pour les données PostgreSQL
      - animal_shelter_data:/var/lib/postgresql/data:Z

      # Scripts SQL exécutés automatiquement au premier démarrage
      - ./postgres/init-db:/docker-entrypoint-initdb.d

    networks:
      - animal_shelter_backend

volumes:
  animal_shelter_data:

networks:
  animal_shelter_backend:
